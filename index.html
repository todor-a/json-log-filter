<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Log Field Selector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            min-height: 100vh;
            height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            background: #2d2d2d;
            border: 1px solid #444;
            overflow: hidden;
            flex: 1;
            display: grid;
            grid-template-rows: auto 1fr;
            width: 100%;
        }

        .header {
            background: #2d2d2d;
            border-bottom: 1px solid #444;
            padding: 20px 30px;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: #e0e0e0;
        }

        .header p {
            color: #aaa;
            font-size: 14px;
        }

        .content {
            display: grid;
            grid-template-columns: minmax(200px, 1fr) 350px minmax(200px, 1fr);
            gap: 0;
            min-height: 0;
            width: 100%;
            overflow: hidden;
        }

        .input-section, .output-section {
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .input-section {
            border-right: 1px solid #444;
        }

        .output-section {
            border-left: 1px solid #444;
            background: #2a2a2a;
        }

        .field-selector {
            padding: 20px;
            background: #2d2d2d;
            border-left: 1px solid #444;
            border-right: 1px solid #444;
            overflow-y: auto;
            min-height: 0;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #e0e0e0;
        }

        textarea {
            width: 100%;
            flex: 1;
            min-height: 0;
            padding: 12px;
            border: 1px solid #555;
            border-radius: 4px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            resize: none;
            background: #1e1e1e;
            color: #d4d4d4;
        }

        .output-json {
            width: 100%;
            flex: 1;
            min-height: 0;
            padding: 12px;
            border: 1px solid #555;
            border-radius: 4px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            white-space: pre;
            overflow: auto;
            background: #1e1e1e;
            color: #d4d4d4;
        }

        .output-json.empty::before {
            content: 'Filtered JSON will appear here...';
            color: #666;
        }

        .json-key {
            cursor: pointer;
            color: #9cdcfe;
        }

        .json-key:hover {
            color: #4fc1ff;
            text-decoration: underline;
        }

        .json-string { color: #ce9178; }
        .json-number { color: #b5cea8; }
        .json-boolean { color: #569cd6; }
        .json-null { color: #569cd6; }

        textarea:focus {
            outline: none;
            border-color: #666;
        }

        textarea::placeholder {
            color: #666;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            padding: 10px 20px;
            border: 1px solid #555;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            background: #3c3c3c;
            color: #d4d4d4;
        }

        .btn-primary {
            background: #0e639c;
            color: white;
            border-color: #0e639c;
            flex: 1;
        }

        .btn-primary:hover {
            background: #1177bb;
            border-color: #1177bb;
        }

        .btn-secondary {
            background: #3c3c3c;
            color: #d4d4d4;
            border: 1px solid #555;
        }

        .btn-secondary:hover {
            background: #4c4c4c;
        }

        .field-item {
            display: flex;
            align-items: flex-start;
            padding: 8px;
            margin-bottom: 4px;
            background: #1e1e1e;
            border: 1px solid #444;
            border-radius: 3px;
        }

        .field-item:hover {
            background: #2a2a2a;
        }

        .field-item input[type="checkbox"] {
            margin-right: 10px;
            margin-top: 3px;
            cursor: pointer;
            width: 16px;
            height: 16px;
            accent-color: #0e639c;
        }

        .field-label {
            flex: 1;
            cursor: pointer;
            user-select: none;
        }

        .field-path {
            font-weight: 500;
            color: #d4d4d4;
            margin-bottom: 2px;
        }

        .field-type {
            font-size: 12px;
            color: #888;
        }

        .nested-level-1 { margin-left: 20px; }
        .nested-level-2 { margin-left: 40px; }
        .nested-level-3 { margin-left: 60px; }
        .nested-level-4 { margin-left: 80px; }
        .nested-level-5 { margin-left: 100px; }

        .field-item.collapsed-children {
            display: none;
        }

        .collapse-btn {
            background: none;
            border: none;
            padding: 0;
            margin-right: 6px;
            margin-top: 2px;
            cursor: pointer;
            font-size: 10px;
            color: #888;
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .collapse-btn:hover {
            color: #ccc;
        }

        .field-header {
            display: flex;
            align-items: flex-start;
            flex: 1;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #444;
        }

        .controls button {
            flex: 1;
            padding: 8px 12px;
            font-size: 13px;
        }

        .error-message {
            background: #3d1f1f;
            color: #ff6b6b;
            padding: 10px;
            border-radius: 3px;
            margin-top: 15px;
            font-size: 14px;
            border: 1px solid #5c2a2a;
        }

        .success-message {
            background: #1f3d1f;
            color: #6bff6b;
            padding: 10px;
            border-radius: 3px;
            margin-top: 15px;
            font-size: 14px;
            border: 1px solid #2a5c2a;
        }

        .stats {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 10px;
        }

        @media (max-width: 900px) {
            .content {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto auto;
            }

            .input-section, .output-section, .field-selector {
                border: none;
                border-bottom: 1px solid #444;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>JSON Log Field Selector</h1>
            <p>Paste your JSON logs, select the fields you want to keep, and export the filtered result</p>
        </div>

        <div class="content">
            <div class="input-section">
                <div class="section-title">Input JSON</div>
                <textarea id="inputJson" placeholder='Paste your JSON log here, e.g.:
[
  {
    "insertId": "abc123",
    "timestamp": "2026-01-13T09:09:28.652Z",
    "jsonPayload": {
      "message": "request completed",
      "level": 30
    }
  }
]'></textarea>
                <div class="button-group">
                    <button class="btn-primary" onclick="parseJson()">Parse JSON</button>
                    <button class="btn-secondary" onclick="clearInput()">Clear</button>
                </div>
                <div id="inputMessage"></div>
            </div>

            <div class="field-selector">
                <div class="section-title">Select Fields</div>
                <div class="controls">
                    <button class="btn-secondary" onclick="selectAll()">Select All</button>
                    <button class="btn-secondary" onclick="deselectAll()">Deselect All</button>
                </div>
                <div class="controls">
                    <button class="btn-secondary" onclick="expandAll()">Expand All</button>
                    <button class="btn-secondary" onclick="collapseAll()">Collapse All</button>
                </div>
                <div class="stats" id="fieldStats"></div>
                <div id="fieldList"></div>
            </div>

            <div class="output-section">
                <div class="section-title">Live Preview</div>
                <div id="outputJson" class="output-json empty" role="region" aria-label="Filtered JSON output"></div>
                <div class="button-group">
                    <button class="btn-secondary" onclick="copyOutput()">Copy to Clipboard</button>
                </div>
                <div id="outputMessage"></div>
            </div>
        </div>
    </div>

    <script>
        let parsedData = null;
        let fieldPaths = new Set();
        let collapsedParents = new Set();
        let checkedPaths = new Set(); // Track checked state separately
        let excludedPaths = new Set();
        let lastOutputText = '';

        function getAllFieldPaths(obj, prefix = '') {
            const paths = [];
            
            if (Array.isArray(obj)) {
                if (obj.length > 0) {
                    getAllFieldPaths(obj[0], prefix).forEach(path => paths.push(path));
                }
            } else if (obj !== null && typeof obj === 'object') {
                for (const key in obj) {
                    const path = prefix ? `${prefix}.${key}` : key;
                    paths.push(path);
                    
                    if (typeof obj[key] === 'object' && obj[key] !== null) {
                        getAllFieldPaths(obj[key], path).forEach(subPath => paths.push(subPath));
                    }
                }
            }
            
            return paths;
        }

        function getFieldType(obj, path) {
            const parts = path.split('.');
            let current = obj;
            
            if (Array.isArray(current) && current.length > 0) {
                current = current[0];
            }
            
            for (const part of parts) {
                if (current === null || current === undefined) return 'null';
                current = current[part];
                if (Array.isArray(current) && current.length > 0) {
                    current = current[0];
                }
            }
            
            if (current === null) return 'null';
            if (Array.isArray(current)) return 'array';
            return typeof current;
        }

        function getNestingLevel(path) {
            return path.split('.').length - 1;
        }

        function parseJson() {
            const input = document.getElementById('inputJson').value.trim();
            const messageDiv = document.getElementById('inputMessage');
            
            if (!input) {
                messageDiv.innerHTML = '<div class="error-message">Please paste some JSON data</div>';
                return;
            }
            
            try {
                // Remove dangling commas before parsing
                const cleanedInput = input
                    .replace(/,(\s*[}\]])/g, '$1'); // Remove commas before } or ]
                
                parsedData = JSON.parse(cleanedInput);
                
                // Format the input JSON like Prettier
                const formattedJson = JSON.stringify(parsedData, null, 2);
                document.getElementById('inputJson').value = formattedJson;
                
                fieldPaths = new Set(getAllFieldPaths(parsedData));
                checkedPaths = new Set(fieldPaths);
                
                messageDiv.innerHTML = '<div class="success-message">✓ JSON parsed successfully!</div>';
                renderFieldList();
                updateStats();
            } catch (error) {
                messageDiv.innerHTML = `<div class="error-message">Invalid JSON: ${error.message}</div>`;
                parsedData = null;
                document.getElementById('fieldList').innerHTML = '';
                document.getElementById('outputJson').value = '';
            }
        }

        function buildParentChildMap(paths) {
            const parentChildren = new Map();
            
            for (const path of paths) {
                const parts = path.split('.');
                for (let i = 1; i < parts.length; i++) {
                    const parent = parts.slice(0, i).join('.');
                    if (!parentChildren.has(parent)) {
                        parentChildren.set(parent, new Set());
                    }
                    parentChildren.get(parent).add(path);
                }
            }
            
            return parentChildren;
        }

        function isChildOfCollapsedParent(path) {
            for (const collapsedParent of collapsedParents) {
                if (path.startsWith(collapsedParent + '.')) {
                    return true;
                }
            }
            return false;
        }

        function renderFieldList() {
            const fieldList = document.getElementById('fieldList');
            const sortedPaths = Array.from(fieldPaths).sort();
            const parentChildren = buildParentChildMap(sortedPaths);
            
            let html = '';
            for (const path of sortedPaths) {
                // Skip if this field is a child of a collapsed parent
                if (isChildOfCollapsedParent(path)) {
                    continue;
                }
                
                const type = getFieldType(parsedData, path);
                const level = getNestingLevel(path);
                const nestClass = level > 0 ? `nested-level-${Math.min(level, 5)}` : '';
                const displayName = path.split('.').pop();
                const hasChildren = parentChildren.has(path);
                const isCollapsed = collapsedParents.has(path);
                const collapseIcon = isCollapsed ? '▶' : '▼';
                const isChecked = checkedPaths.has(path);
                
                html += `
                    <div class="field-item ${nestClass}" data-path="${path}">
                        ${hasChildren ? `<button class="collapse-btn" onclick="toggleCollapse('${path}')" title="${isCollapsed ? 'Expand' : 'Collapse'}">${collapseIcon}</button>` : '<span style="width: 14px; margin-right: 6px; flex-shrink: 0;"></span>'}
                        <input type="checkbox" id="field-${path.replace(/\./g, '-')}" data-path="${path}" ${isChecked ? 'checked' : ''} onchange="handleFieldChange(this)">
                        <label class="field-label" for="field-${path.replace(/\./g, '-')}">
                            <div class="field-path">${displayName}</div>
                            <div class="field-type">Type: ${type}</div>
                        </label>
                    </div>
                `;
            }
            
            fieldList.innerHTML = html || '<p style="color: #666;">No fields to display. Parse JSON first.</p>';
            updateParentStates();
            syncCheckedPathsFromDom();
        }

        function toggleCollapse(path) {
            if (collapsedParents.has(path)) {
                collapsedParents.delete(path);
            } else {
                collapsedParents.add(path);
            }
            renderFieldList();
        }

        function expandAll() {
            collapsedParents.clear();
            renderFieldList();
        }

        function collapseAll() {
            const sortedPaths = Array.from(fieldPaths).sort();
            const parentChildren = buildParentChildMap(sortedPaths);
            
            // Find all parent fields and collapse them
            for (const path of sortedPaths) {
                if (parentChildren.has(path)) {
                    collapsedParents.add(path);
                }
            }
            renderFieldList();
        }

        function handleFieldChange(checkbox) {
            const path = checkbox.dataset.path;
            const isChecked = checkbox.checked;
            
            if (!isChecked) {
                // If unchecking a field, uncheck all its children
                document.querySelectorAll('#fieldList input[type="checkbox"]').forEach(cb => {
                    const cbPath = cb.dataset.path;
                    if (cbPath.startsWith(path + '.')) {
                        cb.checked = false;
                    }
                });
            } else {
                // If checking a field, check all its children
                document.querySelectorAll('#fieldList input[type="checkbox"]').forEach(cb => {
                    const cbPath = cb.dataset.path;
                    if (cbPath.startsWith(path + '.')) {
                        cb.checked = true;
                    }
                });
            }
            syncCheckedPathsFromDom();
            updateParentStates();
            syncCheckedPathsFromDom();
            updateStats();
        }

        function syncCheckedPathsFromDom() {
            checkedPaths = new Set();
            document.querySelectorAll('#fieldList input[type="checkbox"]:checked').forEach(cb => {
                checkedPaths.add(cb.dataset.path);
            });
        }

        function updateParentStates() {
            const sortedPaths = Array.from(fieldPaths).sort();
            const parentChildren = buildParentChildMap(sortedPaths);
            
            for (const [parent, children] of parentChildren.entries()) {
                const parentCheckbox = document.querySelector(`#fieldList input[type="checkbox"][data-path="${parent}"]`);
                if (!parentCheckbox) continue;

                let checkedCount = 0;
                for (const child of children) {
                    if (checkedPaths.has(child)) {
                        checkedCount += 1;
                    }
                }

                if (checkedCount === 0) {
                    parentCheckbox.checked = false;
                    parentCheckbox.indeterminate = false;
                } else if (checkedCount === children.size) {
                    parentCheckbox.checked = true;
                    parentCheckbox.indeterminate = false;
                } else {
                    parentCheckbox.checked = false;
                    parentCheckbox.indeterminate = true;
                }
            }
        }

        function updateStats() {
            const total = fieldPaths.size;
            const selected = document.querySelectorAll('#fieldList input[type="checkbox"]:checked').length;
            document.getElementById('fieldStats').textContent = `${selected} of ${total} fields selected`;
            
            // Auto-update the preview silently
            applyFilter(true);
        }

        function selectAll() {
            document.querySelectorAll('#fieldList input[type="checkbox"]').forEach(cb => cb.checked = true);
            syncCheckedPathsFromDom();
            updateParentStates();
            syncCheckedPathsFromDom();
            updateStats();
        }

        function deselectAll() {
            document.querySelectorAll('#fieldList input[type="checkbox"]').forEach(cb => cb.checked = false);
            syncCheckedPathsFromDom();
            updateParentStates();
            syncCheckedPathsFromDom();
            updateStats();
        }

         function filterObject(obj, selectedPaths, prefix = '') {
             if (Array.isArray(obj)) {
                 return obj.map(item => filterObject(item, selectedPaths, prefix));
             }
             
             if (obj === null || typeof obj !== 'object') {
                 return obj;
             }
             
             const filtered = {};
              const selectedArray = Array.from(selectedPaths);
             
              for (const key in obj) {
                  const fullPath = prefix ? `${prefix}.${key}` : key;
                  const keyIsSelected = selectedArray.includes(fullPath);
                  // Check if this key is a parent of any selected path
                  const hasSelectedChildren = selectedArray.some(path => path.startsWith(fullPath + '.'));

                  if (keyIsSelected && !hasSelectedChildren) {
                      // Include the entire value for this key
                      filtered[key] = obj[key];
                  } else if (keyIsSelected || hasSelectedChildren) {
                      // Recursively filter children (allows excluding a single child when parent is selected)
                      const childPaths = new Set();
                      selectedPaths.forEach(path => {
                          if (path.startsWith(fullPath + '.')) {
                              childPaths.add(path.substring(fullPath.length + 1));
                          }
                      });

                      if (typeof obj[key] === 'object' && obj[key] !== null) {
                          filtered[key] = filterObject(obj[key], childPaths, '');
                      }
                  }
              }
             
             return filtered;
         }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function renderJsonValue(value, prefix, indentLevel) {
            const indent = '  '.repeat(indentLevel);
            const nextIndent = '  '.repeat(indentLevel + 1);

            if (Array.isArray(value)) {
                if (value.length === 0) return '[]';
                const items = value.map(item => `${nextIndent}${renderJsonValue(item, prefix, indentLevel + 1)}`);
                return `[
${items.join(',\n')}
${indent}]`;
            }

            if (value !== null && typeof value === 'object') {
                const keys = Object.keys(value);
                if (keys.length === 0) return '{}';
                const entries = keys.map(key => {
                    const fullPath = prefix ? `${prefix}.${key}` : key;
                    const keyHtml = `<span class="json-key" data-path="${fullPath}">"${escapeHtml(key)}"</span>`;
                    const valueHtml = renderJsonValue(value[key], fullPath, indentLevel + 1);
                    return `${nextIndent}${keyHtml}: ${valueHtml}`;
                });
                return `{
${entries.join(',\n')}
${indent}}`;
            }

            if (value === null) return '<span class="json-null">null</span>';
            if (typeof value === 'string') return `<span class="json-string">"${escapeHtml(value)}"</span>`;
            if (typeof value === 'number') return `<span class="json-number">${value}</span>`;
            if (typeof value === 'boolean') return `<span class="json-boolean">${value}</span>`;
            return escapeHtml(value);
        }

        function renderOutputJson(filtered) {
            const output = document.getElementById('outputJson');
            if (!filtered) {
                output.textContent = '';
                output.classList.add('empty');
                return;
            }

            output.classList.remove('empty');
            output.innerHTML = renderJsonValue(filtered, '', 0);
        }

        function applyFilter(silent = false) {
            const outputDiv = document.getElementById('outputMessage');
            
            if (!parsedData) {
                if (!silent) {
                    outputDiv.innerHTML = '<div class="error-message">Please parse JSON first</div>';
                }
                return;
            }
            
            const selectedPaths = new Set();
            document.querySelectorAll('#fieldList input[type="checkbox"]:checked').forEach(cb => {
                const path = cb.dataset.path;
                selectedPaths.add(path);
            });
            
            if (selectedPaths.size === 0) {
                renderOutputJson(null);
                lastOutputText = '';
                if (!silent) {
                    outputDiv.innerHTML = '<div class="error-message">Please select at least one field</div>';
                }
                return;
            }
            
            try {
                const filtered = filterObject(parsedData, selectedPaths);
                lastOutputText = JSON.stringify(filtered, null, 2);
                renderOutputJson(filtered);
                if (!silent) {
                    outputDiv.innerHTML = '<div class="success-message">✓ Filter applied successfully!</div>';
                } else {
                    outputDiv.innerHTML = '';
                }
            } catch (error) {
                if (!silent) {
                    outputDiv.innerHTML = `<div class="error-message">Filter error: ${error.message}</div>`;
                }
            }
        }

        function copyOutput() {
            const messageDiv = document.getElementById('outputMessage');
            
            if (!lastOutputText) {
                messageDiv.innerHTML = '<div class="error-message">Nothing to copy. Apply filter first.</div>';
                return;
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(lastOutputText).then(() => {
                    messageDiv.innerHTML = '<div class="success-message">✓ Copied to clipboard!</div>';
                }).catch(() => {
                    messageDiv.innerHTML = '<div class="error-message">Copy failed. Try again.</div>';
                });
            } else {
                const temp = document.createElement('textarea');
                temp.value = lastOutputText;
                document.body.appendChild(temp);
                temp.select();
                document.execCommand('copy');
                document.body.removeChild(temp);
                messageDiv.innerHTML = '<div class="success-message">✓ Copied to clipboard!</div>';
            }
        }

        function clearInput() {
            document.getElementById('inputJson').value = '';
            document.getElementById('inputMessage').innerHTML = '';
            document.getElementById('fieldList').innerHTML = '';
            renderOutputJson(null);
            document.getElementById('outputMessage').innerHTML = '';
            document.getElementById('fieldStats').textContent = '';
            parsedData = null;
            fieldPaths = new Set();
            checkedPaths = new Set();
            lastOutputText = '';
            collapsedParents.clear();
        }

        document.getElementById('outputJson').addEventListener('click', (event) => {
            const keyEl = event.target.closest('.json-key');
            if (!keyEl) return;
            const path = keyEl.dataset.path;
            const checkbox = document.querySelector(`#fieldList input[type="checkbox"][data-path="${path}"]`);
            if (!checkbox) return;
            checkbox.checked = !checkbox.checked;
            handleFieldChange(checkbox);
        });
    </script>
</body>
</html>
